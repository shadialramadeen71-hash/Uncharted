<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سارق السيارات</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:Arial; }
canvas { display:block; margin:auto; }
#ui { position:fixed; top:0; left:0; right:0; padding:8px; display:flex; justify-content:space-between; color:#fff; font-size:14px; text-shadow:1px 1px 3px #000; z-index:10; }
#stars { color:#ff0; font-size:18px; }
#controls { position:fixed; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:10px; z-index:10; }
#controls button { background:rgba(255,255,255,0.2); color:#fff; border:1px solid #fff; border-radius:50%; width:55px; height:55px; font-size:22px; touch-action:manipulation; }
#controls button:active { background:rgba(255,255,255,0.5); }
#msg { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ff0; font-size:24px; font-weight:bold; text-shadow:2px 2px 5px #000; z-index:20; display:none; text-align:center; }
</style>
</head>
<body>
<div id="ui">
  <div>⭐ نجوم: <span id="stars">0</span></div>
  <div>🚔 شرطة: <span id="cops">0</span></div>
  <div>💰 <span id="score">0</span></div>
</div>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="controls">
  <button id="btnL">◀</button>
  <button id="btnU">▲</button>
  <button id="btnD">▼</button>
  <button id="btnR">▶</button>
  <button id="btnB">🚗</button>
</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width=Math.min(window.innerWidth,500);
const H=c.height=window.innerHeight-80;

// Audio
const AC=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,t,type='square'){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.3,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+t);
  o.start();o.stop(AC.currentTime+t);
}
function sirenSound(){
  beep(800,0.15,'sawtooth');
  setTimeout(()=>beep(600,0.15,'sawtooth'),160);
}
function carSound(){ beep(120,0.1,'sawtooth'); }
function stealSound(){ beep(440,0.05);setTimeout(()=>beep(550,0.05),60);setTimeout(()=>beep(660,0.1),120); }
function crashSound(){ beep(200,0.3,'sawtooth');setTimeout(()=>beep(100,0.3,'sawtooth'),100); }

// Game state
let player={x:W/2,y:H/2,angle:0,speed:0,inCar:false,stars:0,score:0};
let keys={};
let cars=[];
let cops=[];
let buildings=[];
let roads=[];
let particles=[];
let sirenTimer=0;
let gameOver=false;

// Generate world
function genWorld(){
  // Roads
  for(let i=0;i<5;i++){
    roads.push({x:0,y:i*(H/4),w:W,h:30,dir:'h'});
    roads.push({x:i*(W/4),y:0,w:30,h:H,dir:'v'});
  }
  // Buildings
  const cols=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'];
  for(let i=0;i<12;i++){
    buildings.push({
      x:50+Math.random()*(W-150),
      y:50+Math.random()*(H-150),
      w:40+Math.random()*60,
      h:40+Math.random()*60,
      color:cols[Math.floor(Math.random()*cols.length)],
      height:30+Math.random()*80
    });
  }
  // Parked cars
  for(let i=0;i<6;i++){
    cars.push({
      x:80+Math.random()*(W-160),
      y:80+Math.random()*(H-160),
      angle:Math.random()*Math.PI*2,
      color:['#e74c3c','#f1c40f','#2ecc71','#e67e22'][Math.floor(Math.random()*4)],
      stolen:false
    });
  }
}

// Draw road
function drawRoad(r){
  ctx.fillStyle='#555';
  ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeStyle='#fff';
  ctx.setLineDash([20,15]);
  ctx.lineWidth=1;
  ctx.beginPath();
  if(r.dir==='h'){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2);}
  else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h);}
  ctx.stroke();
  ctx.setLineDash([]);
}

// Draw building 3D
function drawBuilding(b){
  const sh=b.height*0.4;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(b.x+8,b.y+8,b.w,b.h);
  // Top face
  ctx.fillStyle=b.color;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  // Right side (3D)
  ctx.fillStyle=shadeColor(b.color,-40);
  ctx.beginPath();
  ctx.moveTo(b.x+b.w,b.y);
  ctx.lineTo(b.x+b.w+sh,b.y-sh);
  ctx.lineTo(b.x+b.w+sh,b.y+b.h-sh);
  ctx.lineTo(b.x+b.w,b.y+b.h);
  ctx.fill();
  // Top face (3D roof)
  ctx.fillStyle=shadeColor(b.color,20);
  ctx.beginPath();
  ctx.moveTo(b.x,b.y);
  ctx.lineTo(b.x+sh,b.y-sh);
  ctx.lineTo(b.x+b.w+sh,b.y-sh);
  ctx.lineTo(b.x+b.w,b.y);
  ctx.fill();
  // Windows
  ctx.fillStyle='rgba(255,255,150,0.7)';
  for(let wy=b.y+8;wy<b.y+b.h-8;wy+=14)
    for(let wx=b.x+8;wx<b.x+b.w-8;wx+=14)
      ctx.fillRect(wx,wy,8,8);
}

function shadeColor(col,amt){
  let r=parseInt(col.slice(1,3),16)+amt;
  let g=parseInt(col.slice(3,5),16)+amt;
  let bv=parseInt(col.slice(5,7),16)+amt;
  r=Math.max(0,Math.min(255,r));
  g=Math.max(0,Math.min(255,g));
  bv=Math.max(0,Math.min(255,bv));
  return '#'+[r,g,bv].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// Draw car 3D
function drawCar(x,y,angle,color,isPlayer,isCop){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  const w=20,h=36;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(-w/2+4,- h/2+4,w,h);
  // Body
  ctx.fillStyle=color;
  ctx.fillRect(-w/2,-h/2,w,h);
  // Roof (3D effect)
  ctx.fillStyle=shadeColor(color,30);
  ctx.fillRect(-w/2+3,-h/2+8,w-6,h-16);
  // Windshield
  ctx.fillStyle='rgba(150,220,255,0.7)';
  ctx.fillRect(-w/2+4,-h/2+10,w-8,8);
  // Rear window
  ctx.fillRect(-w/2+4,h/2-14,w-8,6);
  // Wheels
  ctx.fillStyle='#111';
  [[-w/2-2,-h/2+4],[w/2-4,-h/2+4],[-w/2-2,h/2-10],[w/2-4,h/2-10]].forEach(([wx,wy])=>{
    ctx.fillRect(wx,wy,6,10);
  });
  // Headlights
  ctx.fillStyle='#ff0';
  ctx.fillRect(-w/2+2,-h/2,5,4);
  ctx.fillRect(w/2-7,-h/2,5,4);
  // Cop lights
  if(isCop){
    ctx.fillStyle=Math.sin(Date.now()/100)>0?'#f00':'#00f';
    ctx.fillRect(-w/2+3,-h/2-6,w-6,6);
  }
  // Player arrow
  if(isPlayer&&!player.inCar){
    ctx.fillStyle='#fff';
    ctx.font='12px Arial';
    ctx.textAlign='center';
    ctx.fillText('🚶',0,0);
  }
  ctx.restore();
}

// Draw player on foot
function drawPlayer(){
  if(player.inCar) return;
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle);
  ctx.font='24px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('🏃',0,0);
  ctx.restore();
}

// Spawn cop
function spawnCop(){
  cops.push({
    x:Math.random()<0.5?0:W,
    y:Math.random()*H,
    angle:0,speed:2+player.stars*0.5
  });
  sirenSound();
}

// Update cops
function updateCops(){
  cops.forEach(cop=>{
    const dx=player.x-cop.x;
    const dy=player.y-cop.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    cop.angle=Math.atan2(dy,dx)+Math.PI/2;
    if(dist>5){
      cop.x+=Math.cos(Math.atan2(dy,dx))*cop.speed;
      cop.y+=Math.sin(Math.atan2(dy,dx))*cop.speed;
    }
    // Catch player
    if(dist<25){
      if(player.stars>0){
        player.stars--;
        document.getElementById('stars').textContent='⭐'.repeat(player.stars)||'0';
        crashSound();
        cops=[];
        player.speed=0;
        showMsg('تم القبض عليك! 🚔\nفقدت نجمة!',2000);
      } else {
        gameOver=true;
        showMsg('GAME OVER\nاضغط للإعادة',0);
      }
    }
  });
}

// Particles
function addParticle(x,y,color){
  for(let i=0;i<8;i++)
    particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:30,color});
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.globalAlpha=p.life/30;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,4,4);
    if(p.life<=0)particles.splice(i,1);
  }
  ctx.globalAlpha=1;
}

function showMsg(txt,dur){
  const m=document.getElementById('msg');
  m.textContent=txt;m.style.display='block';
  if(dur>0)setTimeout(()=>m.style.display='none',dur);
}

// Controls
document.getElementById('btnU').addEventListener('touchstart',()=>keys['ArrowUp']=true);
document.getElementById('btnU').addEventListener('touchend',()=>keys['ArrowUp']=false);
document.getElementById('btnD').addEventListener('touchstart',()=>keys['ArrowDown']=true);
document.getElementById('btnD').addEventListener('touchend',()=>keys['ArrowDown']=false);
document.getElementById('btnL').addEventListener('touchstart',()=>keys['ArrowLeft']=true);
document.getElementById('btnL').addEventListener('touchend',()=>keys['ArrowLeft']=false);
document.getElementById('btnR').addEventListener('touchstart',()=>keys['ArrowRight']=true);
document.getElementById('btnR').addEventListener('touchend',()=>keys['ArrowRight']=false);
document.getElementById('btnB').addEventListener('touchstart',()=>keys['b']=true);
document.getElementById('btnB').addEventListener('touchend',()=>keys['b']=false);

document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

// Steal car
let stealCooldown=0;
function trySteal(){
  if(stealCooldown>0||player.inCar) return;
  cars.forEach(car=>{
    const dx=player.x-car.x,dy=player.y-car.y;
    if(Math.sqrt(dx*dx+dy*dy)<40){
      player.inCar=true;
      player.x=car.x;player.y=car.y;
      player.angle=car.angle;
      car.stolen=true;
      stealSound();
      player.score+=100;
      document.getElementById('score').textContent=player.score;
      if(player.stars<5){
        player.stars++;
        document.getElementById('stars').textContent='⭐'.repeat(player.stars);
        spawnCop();
        if(player.stars>=3)spawnCop();
      }
      addParticle(car.x,car.y,'#ff0');
      stealCooldown=60;
    }
  });
}

function exitCar(){
  if(!player.inCar) return;
  player.inCar=false;
  player.speed=0;
}

let frame=0;
function update(){
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    return;
  }
  frame++;
  if(stealCooldown>0)stealCooldown--;

  // Move
  const maxSpeed=player.inCar?5:3;
  const accel=player.inCar?0.2:0.3;
  if(keys['ArrowUp']){player.speed=Math.min(player.speed+accel,maxSpeed);if(frame%10===0)carSound();}
  else if(keys['ArrowDown'])player.speed=Math.max(player.speed-0.3,-maxSpeed/2);
  else player.speed*=0.92;
  if(keys['ArrowLeft'])player.angle-=0.06;
  if(keys['ArrowRight'])player.angle+=0.06;
  if(keys['b'])trySteal();

  player.x+=Math.sin(player.angle)*player.speed;
  player.y-=Math.cos(player.angle)*player.speed;
  player.x=Math.max(10,Math.min(W-10,player.x));
  player.y=Math.max(10,Math.min(H-10,player.y));

  // Siren
  sirenTimer++;
  if(cops.length>0&&sirenTimer%40===0)sirenSound();

  updateCops();

  // Exit car
  if(keys['b']&&player.inCar&&stealCooldown<=0)exitCar();
}

function draw(){
  // Ground
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#2d5a1b');
  grad.addColorStop(1,'#1a3a0f');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Roads
  roads.forEach(drawRoad);
  // Buildings
  buildings.forEach(drawBuilding);
  // Parked cars
  cars.forEach(car=>{ if(!car.stolen)drawCar(car.x,car.y,car.angle,car.color,false,false); });
  // Cops
  cops.forEach(cop=>drawCar(cop.x,cop.y,cop.angle,'#1a1aff',false,true));
  // Player car
  if(player.inCar)drawCar(player.x,player.y,player.angle,'#e74c3c',true,false);
  // Player on foot
  drawPlayer();
  // Particles
  updateParticles();

  // Mini radar
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();ctx.arc(W-45,H-45,35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0f0';
  ctx.beginPath();ctx.arc(W-45+(player.x/W)*60-30,H-45+(player.y/H)*60-30,4,0,Math.PI*2);ctx.fill();
  cops.forEach(cop=>{
    ctx.fillStyle='#f00';
    ctx.beginPath();ctx.arc(W-45+(cop.x/W)*60-30,H-45+(cop.y/H)*60-30,3,0,Math.PI*2);ctx.fill();
  });
}

function loop(){
  ctx.clearRect(0,0,W,H);
  update();draw();
  requestAnimationFrame(loop);
}

// Click to restart
canvas.addEventListener('click',()=>{
  if(gameOver){
    gameOver=false;cops=[];player.stars=0;player.score=0;player.inCar=false;player.speed=0;
    player.x=W/2;player.y=H/2;
    document.getElementById('stars').textContent='0';
    document.getElementById('score').textContent='0';
    document.getElementById('cops').textContent='0';
    document.getElementById('msg').style.display='none';
    cars.forEach(c=>c.stolen=false);
  }
});

genWorld();
showMsg('اسرق سيارة بزر 🚗\nاهرب من الشرطة! 🚔',3000);
loop();
</script>
</body>
</html>
